<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>東光國小 二次月考卷 聽力播放</title><style>body{margin:0;background:#f2f5fa;color:#192c45;font:17px/1.6 system-ui,"Microsoft JhengHei",sans-serif}main{max-width:960px;margin:auto;padding:32px 20px}h1{font-size:30px}a{color:#126085}section{background:white;padding:24px;border-radius:16px;margin:20px 0}button,select{font:inherit;padding:9px 15px;border:1px solid #cad5df;border-radius:8px;background:white;cursor:pointer}button:hover,button.active{background:#dceefa}audio{width:100%;margin:12px 0}.controls{display:flex;gap:10px;flex-wrap:wrap}ol{padding-left:30px}#list button{text-align:left;width:100%;margin:4px 0}#status{min-height:28px;color:#365c72}small{color:#536779}</style><main><a href="index.html">← 三類總覽</a><p data-answer-link><a href="answers-midterm.html" style="display:inline-block;padding:10px 18px;border:1px solid #b8cbd9;border-radius:10px;background:white">寫完了？前往解答核對 →</a></p><h1>二次月考卷 · 聽力播放</h1><p>依單元與原檔編號排序，共 6 段。可單段播放或連續播放。</p><section><strong id="now">尚未播放</strong><audio id="player" controls preload="metadata"></audio><div class="controls"><button id="prev">上一段</button><button id="start">從頭連播</button><button id="next">下一段</button><button id="stop">停止</button><label><input id="auto" type="checkbox" checked>播完自動下一段</label><label>速度 <select id="rate"><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option></select></label></div><p id="status" role="status">請按「從頭連播」或選擇下方曲目。</p><ol id="list"></ol></section><small>離線使用：請保留 HTML 與音檔放在同一個資料夾。月考卷僅含本次期中考 A、B、C 卷。</small></main><script>const tracks=[{"title": "01. 國小英語 HWG 5 期中考 A 卷 Part A", "src": "01. 國小英語 HWG 5 期中考 A 卷 Part A.mp3"}, {"title": "02. 國小英語 HWG 5 期中考 A 卷 Part B", "src": "02. 國小英語 HWG 5 期中考 A 卷 Part B.mp3"}, {"title": "03. 國小英語 HWG 5 期中考 B 卷 Part A", "src": "03. 國小英語 HWG 5 期中考 B 卷 Part A.mp3"}, {"title": "04. 國小英語 HWG 5 期中考 B 卷 Part B", "src": "04. 國小英語 HWG 5 期中考 B 卷 Part B.mp3"}, {"title": "05. 國小英語 HWG 5 期中考 C 卷 Part A", "src": "05. 國小英語 HWG 5 期中考 C 卷 Part A.mp3"}, {"title": "06. 國小英語 HWG 5 期中考 C 卷 Part B", "src": "06. 國小英語 HWG 5 期中考 C 卷 Part B.mp3"}];const p=document.getElementById('player'),list=document.getElementById('list'),status=document.getElementById('status');let index=-1;
tracks.forEach((t,i)=>{const li=document.createElement('li'),b=document.createElement('button');b.textContent=t.title;b.onclick=()=>play(i);li.append(b);list.append(li)});
async function play(i){if(i<0||i>=tracks.length)return;index=i;p.src=tracks[i].src.split('/').map(encodeURIComponent).join('/');p.playbackRate=Number(document.getElementById('rate').value);document.getElementById('now').textContent=(i+1)+' / '+tracks.length+'　'+tracks[i].title;[...list.querySelectorAll('button')].forEach((b,j)=>{b.classList.toggle('active',i===j);b.setAttribute('aria-current',i===j?'true':'false')});status.textContent='播放中';try{await p.play()}catch(e){if(e.name==='AbortError')return;status.textContent='請按音訊播放鍵繼續；若無法載入，請確認音檔資料夾仍在原位置。'}}
document.getElementById('start').onclick=()=>play(0);document.getElementById('prev').onclick=()=>play(Math.max(0,index-1));document.getElementById('next').onclick=()=>play(index+1);document.getElementById('stop').onclick=()=>{p.pause();p.currentTime=0;status.textContent='已停止'};document.getElementById('rate').onchange=e=>p.playbackRate=Number(e.target.value);p.onended=()=>{if(document.getElementById('auto').checked&&index+1<tracks.length)play(index+1);else status.textContent=index===tracks.length-1?'全部播放完畢':'本段播放完畢'};p.onerror=()=>status.textContent='無法載入音檔，請確認「音檔」資料夾與 HTML 放在一起。';p.onpause=()=>{if(!p.ended)status.textContent='已暫停'};p.onplaying=()=>status.textContent='播放中';</script></html>
